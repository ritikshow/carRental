<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <input type="text" class="form-control w-25" placeholder="Search..." [(ngModel)]="searchTerm" />
    <button class="btn btn-primary" (click)="OpenCarForm(carFormTemplate)">
      <i class="bi bi-plus"></i> Add Car
    </button>
  </div>


  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-light text-center">
        <tr>
          <th>Car Id</th>
          <th>Car Name</th>
          <th>Car Model</th>
          <th style="width: 100px;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedData">
          <td>{{ item.carId}}</td>
          <td>{{ item.carModel}}</td>
          <td>{{ item.carName}}</td>
          <td class="text-center p-1">
            <div class="d-flex justify-content-center align-items-center gap-2">
              <i class="bi bi-eye text-info" role="button" title="View"></i>
              <i class="bi bi-pencil-square text-primary" role="button" (click)="editItem(item)"></i>
              <i class="bi bi-trash text-danger" role="button" (click)="deleteItem(item)"></i>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm" [disabled]="currentPage === 1" (click)="previousPage()">Previous</button>
    <span>Page {{ currentPage }}</span>
    <button class="btn btn-outline-secondary btn-sm" [disabled]="currentPage * pageSize >= filteredData.length" (click)="nextPage()">Next</button>
  </div>
</div>







<!-- Modal Template -->
<ng-template #carFormTemplate let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Add New Car</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">
    <form [formGroup]="carForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="carName" class="form-label">Car Name</label>
        <input type="text" id="carName" formControlName="carName" class="form-control"
               [ngClass]="{'is-invalid': isSubmitted && carForm.get('carName')?.invalid}">
        <div *ngIf="isSubmitted && carForm.get('carName')?.invalid" class="invalid-feedback">
          Car Name is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="carModel" class="form-label">Car Model</label>
        <input type="text" id="carModel" formControlName="carModel" class="form-control"
               [ngClass]="{'is-invalid': isSubmitted && carForm.get('carModel')?.invalid}">
        <div *ngIf="isSubmitted && carForm.get('carModel')?.invalid" class="invalid-feedback">
          Car Model is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" formControlName="description" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="imageFile" class="form-label">Upload Car Image</label>
        <input type="file" id="imageFile" (change)="onFileSelected($event)" class="form-control">
      </div>

      <div *ngIf="previewUrl" class="mb-3 text-center">
        <p class="text-success">Preview:</p>
        <img [src]="previewUrl" alt="Preview" class="img-thumbnail" width="250">
      </div>

      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss('cancel')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Car</button>
      </div>
    </form>
  </div>
</ng-template>
